<!--For 2D Canvas webGPU-->
<!DOCTYPE html>
<html>
<head>
    <title>Barnes-Hut 2D Visualization</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            width: 250px;
        }
        .control-group {
            margin-bottom: 10px;
        }
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
        }
        input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <div class="control-group">
            <label for="zoomSlider">Zoom:</label>
            <input type="range" id="zoomSlider" min="1" max="100" value="50">
            <span id="zoomLevel">1.0x</span>
        </div>
        <div class="control-group">
            <label for="depthSlider">Tree Depth:</label>
            <input type="range" id="depthSlider" min="0" max="10" value="5">
        </div>
        <div class="control-group">
            <label for="sizeSlider">Particle Size:</label>
            <input type="range" id="sizeSlider" min="1" max="10" value="3">
        </div>
        <button id="resetBtn">Reset View</button>
    </div>
    <div id="status">Loading data...</div>

    <script>
        // Configuration
        const config = {
            particleColor: '#FF5555',
            treeColor: 'rgba(100, 100, 255, 0.3)',
            axisColor: 'rgba(255, 255, 255, 0.2)',
            maxParticlesToRender: 10000,
            minScale: 0.1,
            maxScale: 10,
            defaultScale: 1.0,
            zoomSensitivity: 0.002 // Much smaller value for smoother zoom
        };

        // System state
        const state = {
            particles: [],
            treeNodes: [],
            scale: config.defaultScale,
            offsetX: 0,
            offsetY: 0,
            maxDepth: 5,
            particleSize: 3,
            loading: true
        };

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const zoomSlider = document.getElementById('zoomSlider');

        // Convert slider value (1-100) to zoom scale (0.1-10)
        function sliderToScale(sliderValue) {
            // Linear interpolation for more predictable behavior
            const ratio = (sliderValue - 1) / (100 - 1);
            return config.minScale + ratio * (config.maxScale - config.minScale);
        }

        // Convert zoom scale (0.1-10) to slider value (1-100)
        function scaleToSlider(scaleValue) {
            const ratio = (scaleValue - config.minScale) / (config.maxScale - config.minScale);
            return Math.round(1 + ratio * (100 - 1));
        }

        // Update zoom slider position and display
        function updateZoomSlider() {
            zoomSlider.value = scaleToSlider(state.scale);
            document.getElementById('zoomLevel').textContent = state.scale.toFixed(1) + 'x';
        }

        // Initialize visualization
        function init() {
            resizeCanvas();
            setupEventListeners();
            loadData().then(() => {
                state.loading = false;
                document.getElementById('status').textContent = `Loaded ${state.particles.length/3} particles`;
                updateZoomSlider();
                requestAnimationFrame(render);
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        async function loadData() {
            try {
                // Load particle data
                const particlesResponse = await fetch('particles.bin');
                if (!particlesResponse.ok) throw new Error("Failed to load particles.bin");
                
                const particlesData = await particlesResponse.arrayBuffer();
                const count = new Uint32Array(particlesData.slice(0, 4))[0];
                state.particles = new Float32Array(particlesData.slice(4));
                
                // Load tree structure
                const treeResponse = await fetch('tree_structure.json');
                if (!treeResponse.ok) throw new Error("Failed to load tree_structure.json");
                state.treeNodes = await treeResponse.json();
                
            } catch (error) {
                console.error("Loading error:", error);
                document.getElementById('status').textContent = `Error: ${error.message}`;
                document.getElementById('status').style.color = 'red';
            }
        }

        function setupEventListeners() {
            // Window resize
            window.addEventListener('resize', resizeCanvas);
            
            // Zoom slider - only update on mouseup to prevent constant updates
            zoomSlider.addEventListener('change', (e) => {
                const newScale = sliderToScale(e.target.value);
                const zoomRatio = newScale / state.scale;
                
                // Adjust view to maintain center position
                state.offsetX = canvas.width/2 * (1 - zoomRatio) / (newScale * canvas.width) + state.offsetX * zoomRatio;
                state.offsetY = canvas.height/2 * (1 - zoomRatio) / (newScale * canvas.height) + state.offsetY * zoomRatio;
                
                state.scale = newScale;
                updateZoomSlider();
            });
            
            // Tree depth
            document.getElementById('depthSlider').addEventListener('input', (e) => {
                state.maxDepth = parseInt(e.target.value);
            });
            
            // Particle size
            document.getElementById('sizeSlider').addEventListener('input', (e) => {
                state.particleSize = parseInt(e.target.value);
            });
            
            // Reset view
            document.getElementById('resetBtn').addEventListener('click', () => {
                state.scale = config.defaultScale;
                state.offsetX = 0;
                state.offsetY = 0;
                updateZoomSlider();
            });
            
            // Mouse interactions
            let isDragging = false;
            let lastX = 0, lastY = 0;
            
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                state.offsetX += (lastX - e.clientX) / (state.scale * canvas.width);
                state.offsetY += (lastY - e.clientY) / (state.scale * canvas.height);
                lastX = e.clientX;
                lastY = e.clientY;
            });
            
            canvas.addEventListener('mouseup', () => isDragging = false);
            canvas.addEventListener('mouseleave', () => isDragging = false);
            
            // Improved mouse wheel zoom
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                
                // Get mouse position in world coordinates
                const mouseX = (e.clientX / canvas.width - 0.5) * 2 - state.offsetX;
                const mouseY = (e.clientY / canvas.height - 0.5) * 2 - state.offsetY;
                
                // Calculate zoom factor based on wheel delta
                const zoomFactor = 1 - e.deltaY * config.zoomSensitivity;
                const newScale = Math.max(config.minScale, Math.min(state.scale * zoomFactor, config.maxScale));
                
                // Calculate how much we actually zoomed (might be clamped by min/max scale)
                const actualZoomFactor = newScale / state.scale;
                
                // Adjust offset to zoom toward mouse position
                state.offsetX = (state.offsetX - mouseX) * actualZoomFactor + mouseX;
                state.offsetY = (state.offsetY - mouseY) * actualZoomFactor + mouseY;
                
                state.scale = newScale;
                updateZoomSlider();
            });
        }

        function render() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Calculate view parameters
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const viewScale = Math.min(canvas.width, canvas.height) * state.scale * 0.5;
            
            // Draw axes
            ctx.strokeStyle = config.axisColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, centerY + state.offsetY * viewScale);
            ctx.lineTo(canvas.width, centerY + state.offsetY * viewScale);
            ctx.moveTo(centerX + state.offsetX * viewScale, 0);
            ctx.lineTo(centerX + state.offsetX * viewScale, canvas.height);
            ctx.stroke();
            
            // Draw tree nodes
            ctx.strokeStyle = config.treeColor;
            ctx.lineWidth = 1;
            state.treeNodes.forEach(node => {
                if (node.depth > state.maxDepth) return;
                
                const x = centerX + (node.x + state.offsetX) * viewScale;
                const y = centerY + (node.y + state.offsetY) * viewScale;
                const width = node.width * viewScale;
                const height = node.height * viewScale;
                
                ctx.strokeRect(x - width/2, y - height/2, width, height);
            });
            
            // Draw particles (limited for performance)
            ctx.fillStyle = config.particleColor;
            const particleCount = Math.min(state.particles.length/3, config.maxParticlesToRender);
            for (let i = 0; i < particleCount * 3; i += 3) {
                const x = centerX + (state.particles[i] + state.offsetX) * viewScale;
                const y = centerY + (state.particles[i+1] + state.offsetY) * viewScale;
                
                if (x >= -state.particleSize && x <= canvas.width + state.particleSize &&
                    y >= -state.particleSize && y <= canvas.height + state.particleSize) {
                    ctx.beginPath();
                    ctx.arc(x, y, state.particleSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            requestAnimationFrame(render);
        }

        init();
    </script>
</body>
</html>
